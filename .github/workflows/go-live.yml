# Once an hour: is Seedlands on the App Store yet? When it is, the key on the site is
# changed to lead there, and this workflow switches itself off. See .github/go-live.py.
name: Go live with the App Store
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: look
        run: python3 .github/go-live.py
      - name: Publish the change
        if: steps.look.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Seedlands is on the App Store: the key leads there"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Done for good
        if: steps.look.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable go-live.yml --repo "${{ github.repository }}"
