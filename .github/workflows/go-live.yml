# Once an hour: is Seedlands on the App Store? If so, the pages' keys change (go-live.mjs),
# the change is published, and this workflow switches itself off: its work is done.
name: Go live

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: ask
        run: node .github/go-live.mjs
      - name: Publish the change
        if: steps.ask.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Seedlands is on the App Store: the keys lead there now"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Done for good
        if: steps.ask.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable go-live.yml
